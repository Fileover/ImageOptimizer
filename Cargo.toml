[package]
name = "image-optimizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Single-executable image optimizer integrating libjxl, libwebp, jpegoptim (MozJPEG) and OxiPNG (Zopfli)"
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "image_optimizer"
path = "src/lib.rs"

[[bin]]
name = "ImageOptimizer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
walkdir = "2"
ctrlc = "3"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["bmp", "tiff", "gif"] }
oxipng = { version = "10.2.1", default-features = false, features = ["parallel", "zopfli"] }

[build-dependencies]
cmake = "0.1"
cc = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

# Keep debug/test builds usable: codecs and compression crates are slow at opt-level 0.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
